<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>BandoGym — práctica diaria de bandoneón</title>
  <meta name="description" content="Entrada en calor y técnica diaria para bandoneonistas." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#1b1918" />

  <!-- iOS PWA -->
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BandoGym" />

  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button id="backBtn" class="icon-btn back-btn" hidden aria-label="Volver">←</button>
        <h1 id="topbarTitle" class="topbar-title">BandoGym</h1>
        <span id="topbarSpacer" class="topbar-spacer"></span>
      </div>
      <div class="fuelle-divider" aria-hidden="true">
        <svg viewBox="0 0 400 24" preserveAspectRatio="none">
          <!-- El fuelle (pliegues) ocupa el centro, de x=26 a x=374 — no llega
               a tocar los botones de los extremos (ver DECISIONES.md punto 48). -->
          <polyline points="26,2 51,8 76,2 101,8 126,2 151,8 176,2 201,8 226,2 251,8 276,2 301,8 326,2 351,8 374,2" fill="none" stroke="var(--text-faint)" stroke-width="1.3" stroke-linecap="round" />
          <polyline points="26,7 51,13 76,7 101,13 126,7 151,13 176,7 201,13 226,7 251,13 276,7 301,13 326,7 351,13 374,7" fill="none" stroke="var(--text-faint)" stroke-width="1.3" stroke-linecap="round" />
          <polyline points="26,12 51,18 76,12 101,18 126,12 151,18 176,12 201,18 226,12 251,18 276,12 301,18 326,12 351,18 374,12" fill="none" stroke="var(--text-faint)" stroke-width="1.3" stroke-linecap="round" />
          <polyline points="26,17 51,23 76,17 101,23 126,17 151,23 176,17 201,23 226,17 251,23 276,17 301,23 326,17 351,23 374,17" fill="none" stroke="var(--text-faint)" stroke-width="1.3" stroke-linecap="round" />
          <!-- Botones del bandoneón: 3 puntitos verticales en cada extremo, afuera del fuelle -->
          <circle cx="9" cy="5" r="1.7" fill="var(--gold)" />
          <circle cx="9" cy="12" r="1.7" fill="var(--gold)" />
          <circle cx="9" cy="19" r="1.7" fill="var(--gold)" />
          <circle cx="391" cy="5" r="1.7" fill="var(--gold)" />
          <circle cx="391" cy="12" r="1.7" fill="var(--gold)" />
          <circle cx="391" cy="19" r="1.7" fill="var(--gold)" />
        </svg>
      </div>
    </header>

    <main id="screen" class="screen" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
      <a href="#/hoy" class="tab-btn" data-route="hoy">
        <span class="tab-icon" aria-hidden="true">◆</span>
        <span class="tab-label">Hoy</span>
      </a>
      <a href="#/biblioteca" class="tab-btn" data-route="biblioteca">
        <span class="tab-icon" aria-hidden="true">▤</span>
        <span class="tab-label">Bandoteca</span>
      </a>
      <a href="#/nuevo" class="tab-btn" data-route="nuevo">
        <span class="tab-icon" aria-hidden="true">+</span>
        <span class="tab-label">Nuevo</span>
      </a>
      <a href="#/comunidad" class="tab-btn" data-route="comunidad">
        <span class="tab-icon" aria-hidden="true">◉</span>
        <span class="tab-label">Comunidad</span>
      </a>
      <a href="#/perfil" class="tab-btn" data-route="perfil">
        <span class="tab-icon" aria-hidden="true">●</span>
        <span class="tab-label">Perfil</span>
      </a>
    </nav>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>

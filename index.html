<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>BandoGym — práctica diaria de bandoneón</title>
  <meta name="description" content="Entrada en calor y técnica diaria para bandoneonistas." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#1b1918" />

  <!-- iOS PWA -->
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BandoGym" />

  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button id="backBtn" class="icon-btn back-btn" hidden aria-label="Volver">←</button>
        <h1 id="topbarTitle" class="topbar-title">BandoGym</h1>
        <span class="topbar-spacer"></span>
      </div>
      <div class="fuelle-divider" aria-hidden="true">
        <svg viewBox="0 0 400 12" preserveAspectRatio="none">
          <polyline points="0,1.5 20,0.3 40,1.5 60,0.3 80,1.5 100,0.3 120,1.5 140,0.3 160,1.5 180,0.3 200,1.5 220,0.3 240,1.5 260,0.3 280,1.5 300,0.3 320,1.5 340,0.3 360,1.5 380,0.3 400,1.5" fill="none" stroke="var(--text-faint)" stroke-width="1" />
          <polyline points="0,5 20,3.8 40,5 60,3.8 80,5 100,3.8 120,5 140,3.8 160,5 180,3.8 200,5 220,3.8 240,5 260,3.8 280,5 300,3.8 320,5 340,3.8 360,5 380,3.8 400,5" fill="none" stroke="var(--text-faint)" stroke-width="1" />
          <polyline points="0,8.5 20,7.3 40,8.5 60,7.3 80,8.5 100,7.3 120,8.5 140,7.3 160,8.5 180,7.3 200,8.5 220,7.3 240,8.5 260,7.3 280,8.5 300,7.3 320,8.5 340,7.3 360,8.5 380,7.3 400,8.5" fill="none" stroke="var(--text-faint)" stroke-width="1" />
          <polyline points="0,12 20,10.8 40,12 60,10.8 80,12 100,10.8 120,12 140,10.8 160,12 180,10.8 200,12 220,10.8 240,12 260,10.8 280,12 300,10.8 320,12 340,10.8 360,12 380,10.8 400,12" fill="none" stroke="var(--text-faint)" stroke-width="1" />
        </svg>
      </div>
    </header>

    <main id="screen" class="screen" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
      <a href="#/hoy" class="tab-btn" data-route="hoy">
        <span class="tab-icon" aria-hidden="true">◆</span>
        <span class="tab-label">Hoy</span>
      </a>
      <a href="#/biblioteca" class="tab-btn" data-route="biblioteca">
        <span class="tab-icon" aria-hidden="true">▤</span>
        <span class="tab-label">Biblioteca</span>
      </a>
      <a href="#/nuevo" class="tab-btn" data-route="nuevo">
        <span class="tab-icon" aria-hidden="true">+</span>
        <span class="tab-label">Nuevo</span>
      </a>
      <a href="#/perfil" class="tab-btn" data-route="perfil">
        <span class="tab-icon" aria-hidden="true">●</span>
        <span class="tab-label">Perfil</span>
      </a>
    </nav>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
